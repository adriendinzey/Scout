name: Bug report
description: Something is broken or behaves incorrectly
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The query or command that triggers it.
      placeholder: |
        scout ask "quiet place for two under $200 near the water"
      render: shell
    validations:
      required: true

  - type: textarea
    id: trace
    attributes:
      label: Trace
      description: >
        Output of `scout ask --json`, if the problem is in a search. It carries
        the parsed filters, every attempt, and every relaxation — which is
        usually enough to find the cause without reproducing your data.
      render: json

  - type: input
    id: scout-version
    attributes:
      label: Scout version / commit
      placeholder: 0.0.1, or a git SHA
    validations:
      required: true

  - type: input
    id: data-snapshot
    attributes:
      label: City and snapshot date
      description: Inside Airbnb listing IDs are not stable across snapshots.
      placeholder: London, 2026-09-06

  - type: input
    id: environment
    attributes:
      label: OS / environment
      placeholder: Ubuntu 24.04 (WSL2), Docker 28.5

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      render: shell

  - type: checkboxes
    id: privacy
    attributes:
      label: Before you post
      options:
        - label: >
            I have not pasted personal data (host or reviewer names or IDs) into
            this issue.
          required: true
