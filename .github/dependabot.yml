version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # These move together; a mismatched pair breaks the graph in confusing ways.
      langgraph:
        patterns:
          - "langgraph*"
          - "langchain*"
      dev-tooling:
        patterns:
          - "ruff"
          - "mypy"
          - "pytest*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
    # Brindle and pgvector are pinned by ARG, not by a FROM line, so Dependabot
    # will not touch them — bumping Brindle is a decision with an eval re-run
    # attached. See docs/DEVELOPMENT.md.
    ignore:
      # Brindle supports PostgreSQL 16 and 17 ONLY. A major bump breaks
      # `CREATE EXTENSION brindle` and the pgrx build with it, so the postgres
      # major is a deliberate decision gated on Brindle adding support — never a
      # routine dependency update. Patch and minor bumps within 17 are welcome.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
